name: Weekly Blog Publisher

# Runs every Tuesday at 14:00 UTC = 7:00 AM PDT (Los Angeles, March–November)
# During winter (PST, November–March) this fires at 6:00 AM LA time.
# GitHub Actions cron is UTC-only; DST shifts cannot be avoided.
# Can also be triggered manually via the GitHub Actions UI for testing.
on:
  schedule:
    - cron: '0 14 * * 2'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish blog post
        id: publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/publish-blog.js

      - name: Content policy check (residential only, no pricing, license wording)
        run: node scripts/test-content-policy.js

      - name: Commit and push
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@omdandevelopment.com"
          git add blog/ content/blog-posted-log.json sitemap.xml
          if git diff --staged --quiet; then
            echo "Nothing to commit — no new topic was selected or library is empty."
            exit 0
          fi
          TITLE="${{ steps.publish.outputs.blog_title }}"
          git commit -m "feat(blog): auto-publish — ${TITLE}"
          git push origin main

      - name: Notify search engines of the new post (IndexNow)
        if: steps.publish.outputs.blog_slug != ''
        run: |
          sleep 90  # give GitHub Pages time to deploy
          curl -s -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow             -H "Content-Type: application/json; charset=utf-8"             -d "{\"host\":\"omdandevelopment.com\",\"key\":\"2f4e3e585b1ce4f8de356be64417fe76\",\"keyLocation\":\"https://omdandevelopment.com/2f4e3e585b1ce4f8de356be64417fe76.txt\",\"urlList\":[\"https://omdandevelopment.com/blog/${{ steps.publish.outputs.blog_slug }}/\",\"https://omdandevelopment.com/blog/\"]}" || true
